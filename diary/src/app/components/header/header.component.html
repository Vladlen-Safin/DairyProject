<mat-toolbar class="header">

    <div class="container-fluid">

        <!-- Верхняя часть Header -->

        <div class="header-top">

            <!-- ========================================= -->
            <!-- Информация об ученике -->
            <!-- ========================================= -->

            <div class="student-info">

                <div class="avatar">

                    <span class="material-symbols-rounded">
                        account_circle
                    </span>

                </div>

                <div class="student-block">

                    <div class="student-name">

                        {{ studentName }}

                    </div>

                    <!-- При необходимости можно вернуть класс -->
                    <!--
                    <div class="student-class">
                        {{ studentClass }}
                    </div>
                    -->

                </div>

            </div>

            <!-- ========================================= -->
            <!-- Период обучения -->
            <!-- ========================================= -->

            <div class="study-period">

                <div class="period-title">

                    Период обучения:

                </div>

                <div class="period-value">

                    {{ studyPeriod }}

                </div>

            </div>

            <!-- ========================================= -->
            <!-- Логотип -->
            <!-- ========================================= -->

            <div class="logo-section">

                <div class="logo-info">

                    <img
                        class="logo"
                        src="images/logo.png?v=2"
                        alt="Электронный дневник">

                    <div class="logo-text">

                        <span>ЭЛЕКТРОННЫЙ</span>

                        <span>ДНЕВНИК</span>

                    </div>

                </div>

                <button
                    mat-button
                    class="logout-button"
                    (click)="logout()">

                    <span class="material-symbols-rounded">

                        logout

                    </span>

                    Выйти

                </button>

            </div>

        </div>

        <!-- ========================================= -->
        <!-- Нижнее меню -->
        <!-- ========================================= -->

        <nav class="navigation" aria-label="Основная навигация">

            <a
                routerLink="/schedule"
                routerLinkActive="active" ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{exact:true}">

                <span class="material-symbols-rounded">

                    calendar_month

                </span>

                <span>

                    Расписание<span class="desktop-nav-label"> занятий</span>

                </span>

            </a>

            <a
                routerLink="/diary"
                routerLinkActive="active" ariaCurrentWhenActive="page">

                <span class="material-symbols-rounded">

                    menu_book

                </span>

                <span>

                    Дневник

                </span>

            </a>

            <a
                routerLink="/final-grade"
                routerLinkActive="active" ariaCurrentWhenActive="page">

                <span class="material-symbols-rounded">

                    check

                </span>

                <span>

                    <span class="desktop-nav-label">Итоговые оценки</span><span class="mobile-nav-label">Итоги</span>

                </span>

            </a>

        </nav>

    </div>

</mat-toolbar>
