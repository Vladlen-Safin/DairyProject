<div class="schedule-page">

    <!-- Верхняя панель -->

<h1 class="page-title">

    Расписание занятий

</h1>
    <div class="toolbar-card">

        <div class="week-buttons">

            <button class="week-button">
                < Предыдущая неделя
            </button>

            <button class="week-button active">
                Текущая неделя
            </button>

            <button class="week-button">
                Следующая неделя >
            </button>

        </div>

        <div class="calendar">

            <label>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-calendar" viewBox="0 0 16 16">
                    <path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z"/>
                  </svg> 
                Выберите неделю:
            </label>
        
            <div class="week-picker">
        
                <input
                    class="week-display"
                    type="text"
                    [value]="weekRange"
                    readonly
                    (click)="weekInput.click()">
        
                <input
                    #weekInput
                    class="hidden-week-input"
                    type="week"
                    [value]="selectedWeek"
                    (change)="onWeekChange($event)">
        
            </div>
        
        </div>

    </div>

    <!-- Таблица -->

    <div class="schedule-card">

        <!-- Заголовок -->

        <div class="schedule-card2">
            <div class="current-date">
                <span class="day">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-calendar" viewBox="0 0 16 16">
                        <path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z"/>
                      </svg> {{ currentDate }}
                </span>
            </div>
            <div class="schedule-grid">

                <!-- Заголовок -->
                <div class="grid-header">Пара</div>
                <div class="grid-header">Время</div>
                <div class="grid-header">Предмет</div>
                <div class="grid-header">Преподаватель</div>
                <div class="grid-header">Аудитория</div>
            
                <ng-container *ngFor="let lesson of lessons">
            
                    <div class="cell pair-cell">
                        <div class="pair-number">
                            {{ lesson.number }}
                        </div>
                        <div class="pair-time">
                            {{ lesson.time }}
                        </div>
                    </div>
                    <div class="cell subject-cell">
                        {{ lesson.subject }}
                    </div>
            
                    <div class="cell teacher-cell">
                        {{ lesson.teacher }}
                    </div>
                    <div class="cell room-cell">
                        {{ lesson.room }}
                    </div>
            
                </ng-container>
            
            </div>
        
        </div>

    </div>

</div>
